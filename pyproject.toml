[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa-italia"
version = "0.1.0"
description = "Valuing Italian renewable PPAs"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "requests>=2.31",
    "entsoe-py>=0.6",
    "streamlit>=1.40",
    "plotly>=5.20",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
