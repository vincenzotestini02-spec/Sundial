# Market assumptions. The imbalance cost is computed from the zone's real imbalance prices when
# available (see ppa_italia.imbalance); the value below is only the fallback placeholder.
# source: placeholder, illustrative imbalance cost for solar (EUR/MWh), used only if no imbalance data
imbalance_cost = 3.0
# source: assumed share of solar output missed by the day-ahead forecast
imbalance_error_share = 0.10
# source: placeholder, illustrative GoO market value (EUR/MWh)
goo_value = 1.0
# source: placeholder, illustrative minimum margin the producer requires (EUR/MWh)
margin = 2.0
# source: assumed cost of capital for a merchant-exposed solar project
discount_rate = 0.07
# source: assumed flat real merchant prices
merchant_escalation_pct = 0.0
# source: assumed loss given default for a PPA counterparty (unsecured corporate)
lgd = 0.6
